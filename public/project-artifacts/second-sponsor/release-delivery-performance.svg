<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Second Sponsor release delivery performance</title>
  <desc id="desc">A verified engineering metric visualization showing a clean installation of 4,991 packages improving from approximately two minutes thirty seconds to 0.73 seconds, and a mobile cold installation improving from 42 seconds to 21 seconds.</desc>
  <rect width="1600" height="1000" fill="#10171c"/>
  <rect x="72" y="72" width="1456" height="856" rx="28" fill="#172127" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="144" y="180" fill="#f6eee8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" letter-spacing="5">SECOND SPONSOR · VERIFIED DELIVERY EVIDENCE</text>
  <text x="144" y="268" fill="#f6eee8" font-family="Georgia, serif" font-size="66">Faster paths to a shipped mobile product</text>
  <text x="144" y="326" fill="#aab6b9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Measured before and after improvements used in the case study.</text>
  <line x1="144" y1="408" x2="1456" y2="408" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="144" y="484" fill="#d8e0df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" letter-spacing="3">CLEAN INSTALL · 4,991 PACKAGES</text>
  <text x="144" y="588" fill="#7f9094" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28">BEFORE</text>
  <text x="144" y="662" fill="#f6eee8" font-family="Georgia, serif" font-size="76">~2m 30s</text>
  <path d="M665 624h152m-39-39 39 39-39 39" fill="none" stroke="#e26d99" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="888" y="588" fill="#e7a4ba" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28">AFTER</text>
  <text x="888" y="662" fill="#f6eee8" font-family="Georgia, serif" font-size="76">0.73s</text>
  <line x1="144" y1="734" x2="1456" y2="734" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="144" y="810" fill="#d8e0df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" letter-spacing="3">MOBILE COLD INSTALL</text>
  <text x="144" y="884" fill="#f6eee8" font-family="Georgia, serif" font-size="58">42s</text>
  <path d="M398 852h112m-32-32 32 32-32 32" fill="none" stroke="#e26d99" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="560" y="884" fill="#f6eee8" font-family="Georgia, serif" font-size="58">21s</text>
  <text x="1244" y="884" fill="#e7a4ba" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" text-anchor="end">50% LESS TIME</text>
</svg>
