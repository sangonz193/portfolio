<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual Data Loom pairing and transfer flow</title>
  <desc id="desc">A conceptual flow diagram showing an anonymous session, a temporary numeric pairing code, a second device entering the code, and a direct WebRTC file transfer between paired devices.</desc>
  <rect width="1600" height="1000" fill="#10171c"/>
  <rect x="72" y="72" width="1456" height="856" rx="28" fill="#172127" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="144" y="180" fill="#f6eee8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" letter-spacing="5">DATA LOOM · CONCEPTUAL FLOW</text>
  <text x="144" y="268" fill="#f6eee8" font-family="Georgia, serif" font-size="66">Pair devices. Transfer directly.</text>
  <text x="144" y="326" fill="#aab6b9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">A high-level representation of the public implementation decisions.</text>
  <rect x="144" y="472" width="276" height="220" rx="20" fill="#1f3132" stroke="#62b6aa" stroke-opacity=".7"/>
  <text x="176" y="540" fill="#8bd1c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="2">DEVICE A</text>
  <text x="176" y="603" fill="#f6eee8" font-family="Georgia, serif" font-size="38">Anonymous</text>
  <text x="176" y="652" fill="#f6eee8" font-family="Georgia, serif" font-size="38">session</text>
  <path d="M458 582h144m-36-36 36 36-36 36" fill="none" stroke="#62b6aa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="638" y="472" width="324" height="220" rx="20" fill="#1f3132" stroke="#62b6aa" stroke-opacity=".7"/>
  <text x="674" y="540" fill="#8bd1c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="2">PAIRING</text>
  <text x="674" y="603" fill="#f6eee8" font-family="Georgia, serif" font-size="38">Temporary numeric</text>
  <text x="674" y="652" fill="#f6eee8" font-family="Georgia, serif" font-size="38">code</text>
  <path d="M1000 582h144m-36-36 36 36-36 36" fill="none" stroke="#62b6aa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1180" y="472" width="276" height="220" rx="20" fill="#1f3132" stroke="#62b6aa" stroke-opacity=".7"/>
  <text x="1212" y="540" fill="#8bd1c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="2">DEVICE B</text>
  <text x="1212" y="603" fill="#f6eee8" font-family="Georgia, serif" font-size="38">Enter code</text>
  <path d="M420 786c151 94 609 94 760 0" fill="none" stroke="#62b6aa" stroke-width="12" stroke-linecap="round"/>
  <path d="M1140 748l40 38-53 19" fill="#62b6aa"/>
  <text x="800" y="878" fill="#8bd1c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" letter-spacing="3" text-anchor="middle">DIRECT WEBRTC FILE TRANSFER BETWEEN PAIRED DEVICES</text>
</svg>
